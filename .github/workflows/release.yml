# Builds the Flatpak once, then publishes it two ways:
#   * the single-file bundle as a GitHub Release asset (manual install)
#   * the ostree repo to GitHub Pages (adds `flatpak update` support)
#
# Triggered by pushing a tag, e.g.  git tag v0.1.0 && git push --tags
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # create the release
  pages: write      # publish the repo
  id-token: write

env:
  APP_ID: io.github.jeffawe.Chute
  GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      # Build environment only. This image publishes no tag newer than
      # gnome-47, so the GNOME 49 runtime the manifest asks for is pulled from
      # Flathub by --install-deps-from=flathub instead of coming pre-baked.
      # Costs a download; avoids pinning the app to an older runtime than the
      # one it was developed and tested against.
      image: bilelmoussaoui/flatpak-github-actions:gnome-47
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Cache Flatpak runtimes
        uses: actions/cache@v4
        with:
          path: /var/lib/flatpak
          key: flatpak-runtimes-gnome49-${{ hashFiles('packaging/*.yml') }}
          restore-keys: flatpak-runtimes-gnome49-

      - name: Fetch Flathub shared modules
        # libappindicator and its dependencies; org.gnome.Platform omits them.
        run: git clone --depth 1 https://github.com/flathub/shared-modules.git packaging/shared-modules

      - name: Import signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          # The repo and the bundle must be signed by the key published in
          # chute.flatpakrepo, or clients reject them.
          gpg --list-secret-keys --keyid-format=long

      - name: Build
        run: |
          # System scope, not --user: the container runs as root and already
          # has flathub as a system remote. A --user build resolves against
          # user remotes, which are empty here, and fails with
          # "No remote refs found for flathub".
          # --gpg-sign belongs here too, not only on build-update-repo:
          # this is the step that commits the app into the repo, and it is the
          # commit signature clients check. Signing only the summary gives
          # "GPG verification enabled, but no signatures found".
          flatpak-builder --force-clean --disable-rofiles-fuse \
            --install-deps-from=flathub \
            --repo=packaging/repo \
            --gpg-sign="$GPG_KEY_ID" \
            packaging/build "packaging/$APP_ID.yml"

      - name: Create bundle
        run: |
          flatpak build-bundle \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
            --gpg-sign="$GPG_KEY_ID" \
            packaging/repo "$APP_ID.flatpak" "$APP_ID"

      - name: Finalise repo for static hosting
        run: |
          flatpak build-update-repo --generate-static-deltas --prune \
            --gpg-sign="$GPG_KEY_ID" packaging/repo
          cp packaging/chute.flatpakrepo packaging/repo/
          # Pages otherwise ignores files and directories beginning with "_".
          touch packaging/repo/.nojekyll

      - name: Attach bundle to the release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APP_ID }}.flatpak
          generate_release_notes: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packaging/repo

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
